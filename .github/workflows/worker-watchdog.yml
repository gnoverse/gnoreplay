# Deletes gnoreplay worker servers on one job for over 4 hours, or idle for
# over 65 minutes, from outside the coordinator: it still runs if the
# coordinator is down. It does nothing until an HCLOUD_TOKEN secret (a Hetzner
# Cloud API token, read & write, of the workers' project) is set on the
# repository.
name: worker-watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/watchdog.sh
          sparse-checkout-cone-mode: false
      - name: Delete workers on one job for over 4 hours, or idle for over 65 minutes
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          MAX_AGE: "14400"
          MAX_IDLE: "3900"
        run: |
          if [ -z "$HCLOUD_TOKEN" ]; then
            echo "HCLOUD_TOKEN secret not set: nothing to watch."
            exit 0
          fi
          deploy/watchdog.sh
