# gnoreplay-server on a Hetzner Cloud coordinator server, running replays on
# worker servers. See deploy/README.md.

listen = "127.0.0.1:8080"   # behind Caddy, which serves it with TLS
public_url = "https://replay.example.org"
data_dir = "/var/lib/gnoreplay"
# Worker servers running replays at once (~2 h each). Each is billed by the
# started hour while it exists: a worker that finished a replay runs the next
# one, and an idle one is deleted at the end of its billing hour. Their cores
# must fit the project's limit (a ccx13 has 2 dedicated cores, counted apart
# from shared ones).
workers = 2

[github]
token_file = "/etc/gnoreplay/github-token"
poll_interval = "2m"

# Sign-in with GitHub for private repos' results (see config.example.toml).
[github.oauth]
client_id = "Ov23liXXXXXXXXXXXXXX"
client_secret_file = "/etc/gnoreplay/github-oauth-secret"

[chain]
golden_dir = "/var/lib/gnoreplay/golden"
genesis = "/var/lib/gnoreplay/genesis.json"

[job]
gnoreplay_overlay = "/opt/gnoreplay/gnoreplay"
# A replay that has not reported by then fails.
run_timeout = "3h30m"

[hetzner]
# An API token (read & write) of the project the workers are created in.
token_file = "/etc/gnoreplay/hetzner-token"
location = "hel1"
# 2 dedicated vCPUs and 8 GB: a full replay takes about an hour (~$0.08), as
# on 8 shared vCPUs (cpx42) at 62% of the price. With 8 GB, go_mem_limit must
# be 6GiB (the genesis commit peaks above 8 GB without a limit).
server_type = "ccx13"
image = "ubuntu-24.04"
# The ID of the private network the coordinator and workers share, used by
# nothing else (`hcloud network list`).
network = 1234567
# IDs of SSH keys set on workers (`hcloud ssh-key list`; none set means
# Hetzner emails a root password for every worker).
ssh_keys = [12345678]
# The coordinator's private address, where workers fetch their inputs.
listen = "10.0.0.2:8081"
url = "http://10.0.0.2:8081"
go_version = "1.26.1"
go_mem_limit = "6GiB"
# Hard cap on how long a worker runs one replay, from when it was given it:
# the worker is then deleted, whatever the replay's state (by the server
# every minute, and by deploy/watchdog.sh independently of it). Workers also
# power themselves off at this age of their replay.
max_age = "4h"

[repos."gnolang/gno"]
public_reports = true

[repos."gnolang/gno-fixes"]
public_reports = false
viewers_file = "/etc/gnoreplay/gno-fixes-viewers"
