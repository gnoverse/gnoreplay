# gnoreplay-server configuration. Paths are on the replay box.

listen = ":8080"
# How GitHub users reach this server: commit statuses link to job pages here.
public_url = "https://replay.example.org"
data_dir = "/var/lib/gnoreplay"
# Replays run concurrently. Each needs a 9G VM (see run_sandbox) and uses
# ~1-2 cores; size to RAM first.
workers = 2

[github]
# A token that can read the tracked repos' contents and pull requests and
# write their commit statuses (see README.md).
token_file = "/etc/gnoreplay/github-token"
status_context = "mainnet-replay"
# Each poll costs one API call per tracked branch, plus one per 100 open PRs
# per repo.
poll_interval = "2m"

[chain]
# Stopped copy of the reference node's data dir, refreshed by
# scripts/refresh-golden.sh. Jobs copy db/blockstore.db and db/state.db.
golden_dir = "/var/lib/gnoreplay/golden"
genesis = "/var/lib/gnoreplay/genesis.json"

[job]
# The gnoreplay/ directory of this repo: copied into each checkout at
# contribs/gnoreplay and built there.
gnoreplay_overlay = "/opt/gnoreplay/gnoreplay"
# PR code is untrusted: build and replay each run in a microsandbox VM
# (https://microsandbox.dev) with the job dir mounted at the same path, so
# no host secret is reachable and a runaway job can't OOM the host.
# "{job}" is the job ID, "{src}" the checkout. Environment variables do not
# cross into a VM: pass them with -e.
#
# The build needs the Go module proxy (network) and a Go image.
build_sandbox = ["msb", "run", "-q", "-n", "gnoreplay-build-{job}", "--replace",
  "-m", "4G", "-c", "4", "-u", "1000:1000", "--net", "public",
  "--mount-dir", "/var/lib/gnoreplay:/var/lib/gnoreplay:uid=1000,gid=1000",
  "-e", "HOME=/tmp", "-e", "GOMODCACHE=/var/lib/gnoreplay/gomod", "-e", "GOCACHE=/var/lib/gnoreplay/gocache",
  "golang:1.26", "--"]
# The replay needs no network. Measured on mainnet: the first commit (all
# 3.26M genesis accounts) peaks above 8G with Go's default GC; GOMEMLIMIT=7GiB
# in a 9G VM completes. Budget 9G per worker.
run_sandbox = ["msb", "run", "-q", "-n", "gnoreplay-run-{job}", "--replace",
  "-m", "9G", "-c", "4", "-u", "1000:1000", "--no-net",
  "--mount-dir", "/var/lib/gnoreplay:/var/lib/gnoreplay:uid=1000,gid=1000",
  "-e", "HOME=/tmp", "-e", "GNOROOT={src}", "-e", "GOMEMLIMIT=7GiB",
  "debian:bookworm-slim", "--"]
# msb keeps stopped VMs; remove the job's after it ends.
cleanup_command = ["msb", "rm", "gnoreplay-build-{job}", "gnoreplay-run-{job}"]
# Reflinks make the per-job copy of the chain data instant on XFS/btrfs.
copy_command = ["cp", "-a", "--reflink=auto", "{src}", "{dst}"]
build_timeout = "20m"
run_timeout = "4h"

[repos."gnolang/gno"]
public_reports = true

[repos."gnolang/gno-fixes"]
# Private repo: a job's page and report are only reachable through the
# secret link in its commit status, and /queue hides its jobs' details.
public_reports = false

# Priority rules (first match wins; earlier runs first). These are the
# defaults, shown for reference.
[[rules]]
repo = "gnolang/gno"
event = "push"
branch = "chain/mainnet"
[[rules]]
repo = "gnolang/gno"
event = "pull_request"
branch = "chain/mainnet"
[[rules]]
repo = "gnolang/gno"
event = "push"
branch = "master"
[[rules]]
repo = "gnolang/gno-fixes"
event = "push"
branch = "develop"
[[rules]]
repo = "gnolang/gno"
event = "pull_request"
branch = "master"
[[rules]]
repo = "gnolang/gno-fixes"
event = "pull_request"
branch = "develop"
